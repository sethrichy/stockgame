<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f7f5">
  <title>Buy Low Sell High — Stock Trading Game</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=DotGothic16&family=Space+Grotesk:wght@400;500;600;700&display=swap');

    :root {
      color-scheme: light;
      --ink: #17231c;
      --muted: #596b60;
      --paper: #f5f7f5;
      --panel: #ffffff;
      --line: #d7e0da;
      --green: #087a4b;
      --red: #c12e4a;
      --blue: #245bb5;
      --yellow: #866000;
      --mono: 'DM Mono', 'Courier New', monospace;
      --sans: 'Space Grotesk', 'Trebuchet MS', sans-serif;
      --pixel: 'DotGothic16', 'Courier New', monospace;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      min-width: 320px;
      min-height: 100svh;
      overflow: hidden;
      background-color: var(--paper);
      background-image: radial-gradient(ellipse at 50% -20%, #dcefe4 0, transparent 58%), linear-gradient(#dce5df88 1px, transparent 1px), linear-gradient(90deg, #dce5df88 1px, transparent 1px);
      background-size: auto, 36px 36px, 36px 36px;
      color: var(--ink);
      font-family: var(--sans);
      font-size: 16px;
      -webkit-font-smoothing: antialiased;
    }

    button { font: inherit; }

    .topbar {
      height: 64px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 3%;
      background: #fffffff2;
      border-bottom: 1px solid var(--line);
      color: var(--ink);
      backdrop-filter: blur(14px);
    }

    .brand { display: flex; align-items: center; gap: 11px; font-weight: 700; letter-spacing: 0; }
    .brand-mark { display: grid; place-items: center; width: 27px; height: 27px; border: 1px solid #087a4b70; border-radius: 6px; background: #087a4b12; color: var(--green); font-size: 17px; box-shadow: 0 0 6px #087a4b12; }
    .brand-name { font-size: 19px; }
    .brand-tag { margin-left: 2px; color: var(--muted); font-family: var(--mono); font-size: 11px; font-weight: 400; }
    .market-status { display: flex; align-items: center; gap: 8px; color: var(--muted); font-family: var(--mono); font-size: 12px; }
    .live-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 4px #087a4b33; }

    main { display: grid; grid-template-rows: auto auto minmax(0, 1fr); gap: 12px; width: 100%; height: calc(100vh - 64px); height: calc(100svh - 64px); min-height: 0; margin: 0; padding: 12px 3%; overflow: hidden; }
    .round-box { min-width: 112px; padding: 5px 9px; border: 1px solid var(--line); border-radius: 6px; background: #ffffffed; box-shadow: inset 0 1px 0 #ffffff; }
    .round-label { color: var(--muted); font-family: var(--mono); font-size: 9px; text-transform: uppercase; }
    .round-row { display: flex; align-items: center; justify-content: space-between; margin-top: 2px; }
    .round-time { font-family: var(--mono); font-size: 18px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .round-time.urgent { color: var(--red); }
    .round-track { height: 3px; margin-top: 8px; overflow: hidden; border-radius: 3px; background: #d7e0da; }
    .round-fill { width: 100%; height: 100%; background: var(--green); box-shadow: 0 0 4px #087a4b33; transform-origin: left; transition: transform .35s linear, background .3s; }

    .score-strip { display: grid; grid-template-columns: repeat(4, 1fr); margin-bottom: 0; overflow: hidden; border: 1px solid var(--line); border-radius: 6px; background: #ffffffed; box-shadow: 0 8px 24px #19332210, inset 0 1px 0 #ffffff; }
    .metric { padding: 16px 20px 17px; border-right: 1px solid var(--line); }
    .metric:last-child { border-right: 0; }
    .metric-label { color: var(--muted); font-family: var(--mono); font-size: 11px; text-transform: uppercase; }
    .metric-value { margin-top: 7px; font-family: var(--mono); font-size: 23px; font-weight: 500; font-variant-numeric: tabular-nums; }
    .metric-value.positive { color: var(--green); }
    .metric-value.negative { color: var(--red); }

    .event-banner { display: grid; grid-column: 1 / -1; grid-template-columns: minmax(0, 1fr); justify-items: center; gap: 9px; width: 100%; min-height: 160px; padding: 15px 18px; overflow: hidden; border: 1px solid var(--line); border-left: 3px solid var(--blue); border-radius: 6px; background: #ffffffed; box-shadow: 0 8px 20px #1933220c; text-align: center; }
    .event-topline { display: flex; align-items: center; justify-content: center; gap: 10px; color: var(--muted); font-family: var(--mono); font-size: 10px; font-weight: 500; text-transform: uppercase; }
    .event-status { padding: 4px 8px; border-radius: 3px; background: #245bb512; color: var(--blue); }
    .event-copy { display: grid; justify-items: center; gap: 5px; width: 100%; min-width: 0; }
    .event-marquee { width: 100%; overflow: hidden; }
    .event-marquee-track { display: flex; width: max-content; align-items: center; }
    .ticker-copy { display: flex; align-items: baseline; gap: 24px; padding-right: 24px; white-space: nowrap; }
    .event-marquee-track.scrolling { animation: news-scroll var(--ticker-duration, 24s) linear infinite; }
    @keyframes news-scroll { to { transform: translateX(-50%); } }
    .event-title { color: var(--green); font-family: var(--pixel); font-size: 34px; font-weight: 400; }
    .event-separator { color: var(--blue); font-family: var(--mono); font-size: 18px; }
    .event-impacts { display: flex; align-items: center; justify-content: center; flex-wrap: wrap; gap: 7px; }
    .event-impact { display: flex; align-items: center; gap: 6px; padding: 6px 9px; border: 1px solid var(--line); border-radius: 4px; background: #f5f8f6; font-family: var(--mono); font-size: 10px; white-space: nowrap; }
    .event-impact strong { color: var(--ink); font-weight: 500; }
    .event-impact.up span { color: var(--green); }
    .event-impact.down span { color: var(--red); }
    .event-impact.steady span { color: var(--muted); }

    .workspace { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(0, 1fr); align-items: stretch; min-height: 0; gap: 12px; }
    .panel { min-width: 0; min-height: 0; border: 1px solid var(--line); border-radius: 6px; background: #ffffffed; box-shadow: 0 8px 24px #19332210, inset 0 1px 0 #ffffff; }
    .chart-panel { display: grid; grid-column: 1; grid-row: 1; grid-template-rows: auto minmax(0, 1fr) auto; overflow: hidden; }
    .panel-heading { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 17px; border-bottom: 1px solid var(--line); background: #edf3ef; }
    .panel-title { margin: 0; font-size: 16px; font-weight: 600; }
    .market-timestamp { color: var(--muted); font-family: var(--mono); font-size: 10px; }
    .chart-visual { display: grid; grid-template-columns: minmax(0, 1fr) 200px; min-height: 0; }
    .chart-wrap { position: relative; min-width: 0; min-height: 0; height: 100%; padding: 8px 12px 2px 8px; }
    #chart { display: block; width: 100%; height: 100%; }
    .chart-tooltip { position: absolute; top: 15px; left: 62px; padding: 7px 9px; border: 1px solid var(--line); border-radius: 4px; background: #ffffffef; color: var(--green); font-family: var(--mono); font-size: 9px; pointer-events: none; }
    .chart-price-rail { min-height: 0; overflow: auto; border-left: 1px solid var(--line); background: #f5f8f6; }
    .legend { display: flex; flex-wrap: wrap; gap: 16px; padding: 12px 19px 14px; border-top: 1px solid var(--line); }
    .legend-item { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 12px; }
    .legend-dot { width: 7px; height: 7px; border-radius: 50%; }

    .stock-dot { flex: 0 0 auto; width: 8px; height: 8px; border-radius: 50%; }
    .ticker { font-size: 15px; font-weight: 700; }
    .company { overflow: hidden; margin-top: 2px; color: var(--muted); font-size: 12px; text-overflow: ellipsis; white-space: nowrap; }
    .stock-price { text-align: right; font-family: var(--mono); font-size: 16px; font-variant-numeric: tabular-nums; }
    .stock-change { margin-top: 3px; text-align: right; font-family: var(--mono); font-size: 10px; }
    .stock-change.positive { color: var(--green); }
    .stock-change.negative { color: var(--red); }
    .stock-position { display: flex; justify-content: space-between; margin-top: 11px; color: var(--muted); font-family: var(--mono); font-size: 10px; }
    .trade-controls { display: grid; grid-template-columns: minmax(0, 1fr); grid-template-rows: repeat(3, minmax(0, 1fr)); height: 100%; padding: 4px 10px; }
    .trade-stock { display: flex; min-width: 0; flex-direction: column; justify-content: center; padding: 8px 0; border-bottom: 1px solid var(--line); }
    .trade-stock:last-child { border-bottom: 0; }
    .trade-stock-heading { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
    .trade-stock-name { display: flex; align-items: center; gap: 7px; }
    .trade-stock .stock-price { font-size: 14px; }
    .trade-actions { display: grid; grid-template-columns: 1fr 1fr; grid-template-rows: auto auto; gap: 6px; margin-top: 8px; }
    .trade-stock-position { grid-column: 1 / -1; grid-row: 1; color: var(--muted); font-family: var(--mono); font-size: 11px; font-weight: 700; }
    .trade-button.buy { grid-column: 1; grid-row: 2; }
    .trade-button.sell { grid-column: 2; grid-row: 2; }
    .trade-button { min-height: 48px; border: 1px solid var(--stock-color); border-radius: 4px; background: color-mix(in srgb, var(--stock-color) 10%, white); color: var(--stock-color); font-size: 14px; font-weight: 600; cursor: pointer; transition: background .15s, border-color .15s, transform .15s, box-shadow .15s; }
    .trade-button:hover:not(:disabled) { transform: translateY(-1px); }
    .trade-button.buy:hover:not(:disabled) { border-color: var(--green); background: #e1f3e9; color: var(--green); box-shadow: 0 0 5px #087a4b12; }
    .trade-button.sell:hover:not(:disabled) { border-color: var(--red); background: #f9e7eb; color: var(--red); box-shadow: 0 0 5px #c12e4a12; }
    .trade-button:disabled { opacity: .4; cursor: not-allowed; }
    .trade-button:focus-visible, .restart-button:focus-visible { outline: 2px solid var(--blue); outline-offset: 2px; }

    .toast { position: fixed; z-index: 5; right: 22px; bottom: 22px; padding: 11px 15px; border: 1px solid var(--line); border-radius: 5px; background: #ffffff; color: var(--ink); font-family: var(--mono); font-size: 11px; box-shadow: 0 3px 12px #19332214; animation: toast-in .2s ease-out; }
    @keyframes toast-in { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }

    .game-overlay { position: fixed; z-index: 10; inset: 0; display: grid; place-items: center; padding: 20px; background: #030705d9; backdrop-filter: blur(6px); }
    .game-modal { width: min(100%, 390px); padding: 30px; border: 1px solid var(--line); border-radius: 6px; background: #ffffff; box-shadow: 0 12px 36px #19332220; text-align: center; animation: modal-in .25s ease-out; }
    @keyframes modal-in { from { opacity: 0; transform: translateY(9px); } to { opacity: 1; transform: translateY(0); } }
    .modal-icon { display: grid; place-items: center; width: 40px; height: 40px; margin: 0 auto 16px; border: 1px solid #087a4b55; border-radius: 50%; background: #087a4b12; color: var(--green); font-size: 20px; }
    .game-modal h2 { margin: 0; font-size: 24px; }
    .modal-copy { margin: 9px 0 20px; color: var(--muted); font-size: 12px; line-height: 1.6; }
    .final-pnl { margin: 5px 0 22px; font-family: var(--mono); font-size: 33px; font-weight: 500; }
    .restart-button { width: 100%; min-height: 43px; border: 1px solid #087a4b99; border-radius: 4px; background: var(--green); color: #ffffff; font-weight: 700; cursor: pointer; box-shadow: 0 1px 4px #087a4b18; }
    .restart-button:hover { background: #06633d; }
    [hidden] { display: none !important; }

    @media (max-width: 860px) {
      main { padding-right: 2.5%; padding-left: 2.5%; }
      .topbar { padding-right: 4%; padding-left: 4%; }
      .workspace { gap: 8px; }
    }

    @media (max-width: 640px) {
      body { overflow-x: hidden; overflow-y: auto; }
      .topbar { height: 52px; }
      .brand-tag { display: none; }
      .brand-mark { width: 24px; height: 24px; }
      .brand-name { font-size: 13px; }
      .market-status { gap: 6px; font-size: 10px; }
      .live-dot { width: 6px; height: 6px; }
      main { grid-template-rows: auto auto auto; gap: 8px; height: auto; min-height: calc(100vh - 52px); min-height: calc(100svh - 52px); padding: 10px; overflow: visible; }
      .round-box { min-width: 64px; padding: 3px 6px; }
      .round-label { display: none; }
      .round-row { margin-top: 0; justify-content: center; }
      .round-time { font-size: 16px; }
      .round-track { margin-top: 4px; }
      .score-strip { grid-template-columns: repeat(2, minmax(0, 1fr)); }
      .metric { padding: 8px 10px; border-bottom: 1px solid var(--line); }
      .metric:nth-child(2) { border-right: 0; }
      .metric:nth-child(n+3) { border-bottom: 0; }
      .metric-label { font-size: 9px; }
      .metric-value { margin-top: 4px; font-size: 15px; }
      .event-banner { gap: 7px; min-height: 148px; padding: 12px 10px; }
      .event-topline { font-size: 9px; }
      .event-copy { gap: 4px; }
      .event-title { font-size: 20px; }
      .event-impacts { gap: 5px; }
      .event-impact { gap: 4px; padding: 5px 6px; font-size: 8px; }
      .workspace { grid-template-columns: minmax(0, 1fr); grid-template-rows: minmax(300px, 65svh) auto; gap: 8px; }
      .chart-panel { grid-column: 1; grid-row: 1; }
      .chart-visual { grid-template-columns: minmax(0, 1fr) 140px; }
      .chart-wrap { height: 100%; padding: 4px 4px 0 3px; }
      .chart-tooltip { top: 8px; left: 42px; padding: 5px 6px; font-size: 7px; }
      .chart-price-rail { border-top: 0; border-left: 1px solid var(--line); }
      .trade-controls { padding: 2px 7px; }
      .trade-stock { padding: 5px 0; }
      .trade-stock-heading { gap: 3px; }
      .trade-stock-name { gap: 4px; }
      .trade-stock .stock-price { font-size: 11px; }
      .trade-actions { gap: 4px; margin-top: 5px; }
      .trade-stock-position { font-size: 9px; }
      .trade-button { min-height: 38px; padding: 3px 2px; font-size: 11px; }
      .legend { gap: 10px; padding: 9px 12px; }
      .legend-item { font-size: 10px; }
      .trade-panel { grid-column: 1 / -1; }
      .panel-heading { gap: 5px; padding: 9px 10px; }
      .panel-title { font-size: 14px; }
      .market-timestamp { font-size: 8px; }
      .trade-controls { padding: 2px 7px; }
      .trade-stock { padding: 5px 0; }
    }

    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { scroll-behavior: auto !important; animation-duration: .01ms !important; transition-duration: .01ms !important; }
      .event-marquee { overflow: visible; }
      .event-marquee-track { display: block; width: 100%; animation: none !important; transform: none !important; }
      .ticker-copy[aria-hidden="true"] { display: none; }
      .ticker-copy { flex-wrap: wrap; justify-content: center; white-space: normal; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">↗</span>
      <div class="round-box" role="group" aria-label="Time remaining">
        <div class="round-label">Time left</div>
        <div class="round-row"><span class="round-time" id="time-left">3:00</span><span class="round-label">/ 3:00</span></div>
        <div class="round-track"><div class="round-fill" id="round-fill"></div></div>
      </div>
      <span class="brand-name">Buy Low Sell High</span>
      <span class="brand-tag">PAPER TRADING</span>
    </div>
    <div class="market-status"><span class="live-dot" aria-hidden="true"></span><span id="market-status">MARKET OPEN</span></div>
  </header>

  <main>
    <section class="score-strip" aria-label="Portfolio summary">
      <div class="metric"><div class="metric-label">Portfolio value</div><div class="metric-value" id="portfolio-value">$10,000.00</div></div>
      <div class="metric"><div class="metric-label">Total return</div><div class="metric-value" id="total-return">$0.00</div></div>
      <div class="metric"><div class="metric-label">Buying power</div><div class="metric-value" id="buying-power">$10,000.00</div></div>
      <div class="metric"><div class="metric-label">Trades made</div><div class="metric-value" id="trade-count">0</div></div>
    </section>

    <aside class="event-banner" id="world-event" aria-live="polite" aria-atomic="true">
      <div class="event-topline"><span class="event-status">WORLD EVENT</span><span>MARKET IMPACT</span></div>
      <div class="event-copy"><div class="event-marquee"><div class="event-marquee-track" id="event-track"></div></div></div>
      <div class="event-impacts" id="event-impacts" aria-label="Expected stock movement"></div>
    </aside>

    <div class="workspace">
      <section class="panel chart-panel" aria-labelledby="chart-title">
        <div class="panel-heading">
          <h2 class="panel-title" id="chart-title">Live market</h2>
          <span class="market-timestamp" id="market-time">T+00:00</span>
        </div>
        <div class="chart-visual">
          <div class="chart-wrap">
            <canvas id="chart" role="img" aria-label="Live stock price chart with a fixed scale from 0 to 200 dollars"></canvas>
            <div class="chart-tooltip" id="chart-label">PRICE · $0–$200</div>
          </div>
          <aside class="chart-price-rail" aria-label="Stock trading controls"><div class="trade-controls" id="trade-controls"></div></aside>
        </div>
        <div class="legend" id="legend" aria-label="Stock chart legend"></div>
      </section>

    </div>
  </main>

  <div class="toast" id="toast" role="status" hidden></div>
  <div class="game-overlay" id="game-overlay" hidden>
    <section class="game-modal" role="dialog" aria-modal="true" aria-labelledby="modal-title">
      <div class="modal-icon" id="modal-icon" aria-hidden="true">↗</div>
      <h2 id="modal-title">Time's up.</h2>
      <p class="modal-copy" id="modal-copy">The market has closed. Here's how your portfolio did.</p>
      <div class="final-pnl" id="final-pnl">$0.00</div>
      <button class="restart-button" id="restart-button">Play again</button>
    </section>
  </div>

  <script>
    (() => {
      const ROUND_SECONDS = 180;
      const MARKET_TICK_MS = 100;
      const TRADE_REPEAT_MS = 160;
      const CHART_WINDOW_SECONDS = 10;
      const CHART_WINDOW_POINTS = Math.ceil(CHART_WINDOW_SECONDS * 1000 / MARKET_TICK_MS) + 1;
      const MIN_STOCK_PRICE = 1;
      const MAX_STOCK_PRICE = 200;
      const STARTING_CASH = 10000;
      const WORLD_EVENT_INTERVAL_SECONDS = 12;
      const NEWS_DIRECTION_BIAS = 0.1;
      const WORLD_EVENTS = [
        { title: 'AI chip demand surges', description: 'Cloud firms rush to expand data-center capacity.', impacts: { NVDA: 1, TM: -0.45, AAPL: 0.6 } },
        { title: 'Yen strengthens sharply', description: 'Currency shifts pressure Japanese exporters.', impacts: { NVDA: 0.2, TM: -1, AAPL: -0.2 } },
        { title: 'EV incentives expand', description: 'New rebates lift the outlook for automakers.', impacts: { NVDA: 0.2, TM: 1, AAPL: -0.35 } },
        { title: 'Chip supply disruption', description: 'Factory delays threaten global electronics output.', impacts: { NVDA: -1, TM: -0.45, AAPL: -0.8 } },
        { title: 'Record phone preorders', description: 'Strong launch demand boosts consumer-tech shares.', impacts: { NVDA: 0.2, TM: -0.2, AAPL: 1 } },
        { title: 'Data-center boom accelerates', description: 'Fresh infrastructure spending lifts chipmakers.', impacts: { NVDA: 1, TM: -0.35, AAPL: 0.55 } },
        { title: 'AI export curbs hit chip shares', description: 'New trade limits threaten overseas sales.', impacts: { NVDA: -1, TM: 0.2, AAPL: -0.65 } },
        { title: 'Yen slips against the dollar', description: 'A weaker yen gives Japanese exporters room to rally.', impacts: { NVDA: 0.1, TM: 0.9, AAPL: 0.15 } },
        { title: 'Hybrid demand surprises analysts', description: 'Drivers keep choosing fuel-efficient models.', impacts: { NVDA: 0.2, TM: 1, AAPL: -0.15 } },
        { title: 'Phone upgrade demand cools', description: 'Retailers report slower sales of premium devices.', impacts: { NVDA: -0.3, TM: 0.2, AAPL: -1 } },
        { title: 'Cloud budgets face new cuts', description: 'CFOs delay planned data-center upgrades.', impacts: { NVDA: -1, TM: 0.15, AAPL: -0.55 } },
        { title: 'Shipping costs jump worldwide', description: 'Longer routes raise costs for global manufacturers.', impacts: { NVDA: -0.6, TM: -0.85, AAPL: -0.55 } },
        { title: 'Central bank signals rate cuts', description: 'Investors turn optimistic on growth shares.', impacts: { NVDA: 0.55, TM: 0.35, AAPL: 0.8 } },
        { title: 'Driver-assist partnership announced', description: 'Automaker and chipmaker unveil a new collaboration.', impacts: { NVDA: 0.65, TM: 0.8, AAPL: 0.1 } },
        { title: 'Chip factory outage reported', description: 'A production halt threatens electronics supply.', impacts: { NVDA: -1, TM: -0.3, AAPL: -0.75 } },
        { title: 'Consumer tech spending rebounds', description: 'Retail data points to stronger device demand.', impacts: { NVDA: 0.35, TM: 0.2, AAPL: 0.9 } },
        { title: 'Battery breakthrough lifts automakers', description: 'A cheaper battery design boosts EV expectations.', impacts: { NVDA: 0.15, TM: 1, AAPL: -0.2 } }
      ];
      const stocks = [
        { symbol: 'NVDA', name: 'NVIDIA', price: 132.50, start: 132.50, color: '#b85a00', jumpSize: 28.8, shares: 0, history: [] },
        { symbol: 'TM', name: 'Toyota', price: 180.00, start: 180.00, color: '#bb286d', jumpSize: 37.8, shares: 0, history: [] },
        { symbol: 'AAPL', name: 'Apple', price: 190.00, start: 190.00, color: '#2864b5', jumpSize: 24.3, shares: 0, history: [] }
      ];
      const elements = {
        chart: document.querySelector('#chart'),
        tradeControls: document.querySelector('#trade-controls'),
        legend: document.querySelector('#legend'),
        portfolio: document.querySelector('#portfolio-value'),
        return: document.querySelector('#total-return'),
        cash: document.querySelector('#buying-power'),
        tradeCount: document.querySelector('#trade-count'),
        time: document.querySelector('#time-left'),
        fill: document.querySelector('#round-fill'),
        marketTime: document.querySelector('#market-time'),
        status: document.querySelector('#market-status'),
        eventTrack: document.querySelector('#event-track'),
        eventImpacts: document.querySelector('#event-impacts'),
        toast: document.querySelector('#toast'),
        overlay: document.querySelector('#game-overlay'),
        modalIcon: document.querySelector('#modal-icon'),
        modalTitle: document.querySelector('#modal-title'),
        modalCopy: document.querySelector('#modal-copy'),
        finalPnl: document.querySelector('#final-pnl'),
        restart: document.querySelector('#restart-button')
      };

      let cash = STARTING_CASH;
      let remaining = ROUND_SECONDS;
      let tradeCount = 0;
      let finished = false;
      let historyIndex = 0;
      let tickTimer;
      let clockTimer;
      let worldEventIndex = -1;
      let currentWorldEvent;
      let nextWorldEventAt = 0;
      let worldEventOrder = [];
      let worldEventCursor = -1;
      let tradeRepeatTimer;
      let activeTradePointer = null;
      let toastTimer;
      let chartFrame;
      let chartProgress = 1;
      let animationStart = null;
      const money = value => `$${Math.abs(value).toLocaleString('en-US', { minimumFractionDigits: 2, maximumFractionDigits: 2 })}`;

      function formatTime(seconds) {
        return `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`;
      }

      function portfolioValue() {
        return cash + stocks.reduce((sum, stock) => sum + stock.price * stock.shares, 0);
      }

      function reflectPrice(price) {
        const range = MAX_STOCK_PRICE - MIN_STOCK_PRICE;
        const position = ((price - MIN_STOCK_PRICE) % (range * 2) + range * 2) % (range * 2);
        return MIN_STOCK_PRICE + (position <= range ? position : range * 2 - position);
      }

      function seedHistory(stock) {
        const history = Array(CHART_WINDOW_POINTS);
        history[CHART_WINDOW_POINTS - 1] = stock.price;
        for (let index = CHART_WINDOW_POINTS - 2; index >= 0; index--) {
          const randomMove = (Math.random() * 2 - 1) * stock.jumpSize;
          history[index] = reflectPrice(history[index + 1] + randomMove);
        }
        return history;
      }

      function renderLegend() {
        elements.legend.innerHTML = stocks.map(stock => `<span class="legend-item"><span class="legend-dot" style="background:${stock.color}"></span>${stock.symbol}</span>`).join('');
      }

      function renderTradeControls() {
        if (elements.tradeControls.childElementCount !== stocks.length) {
          elements.tradeControls.innerHTML = stocks.map((stock, index) => `<article class="trade-stock" style="--stock-color:${stock.color}">
            <div class="trade-stock-heading">
              <div class="trade-stock-name"><span class="stock-dot" style="background:${stock.color}"></span><span class="ticker" style="color:${stock.color}">${stock.symbol}</span></div>
              <span class="stock-price"></span>
            </div>
            <div class="trade-actions"><span class="trade-stock-position"></span><button class="trade-button buy" data-action="buy" data-stock="${index}" aria-label="Buy one share of ${stock.symbol}">+ Buy</button><button class="trade-button sell" data-action="sell" data-stock="${index}" aria-label="Sell one share of ${stock.symbol}">− Sell</button></div>
          </article>`).join('');
        }

        stocks.forEach((stock, index) => {
          const stockControls = elements.tradeControls.children[index];
          stockControls.querySelector('.trade-stock-heading .stock-price').textContent = money(stock.price);
          stockControls.querySelector('.trade-stock-position').textContent = stock.shares;
          stockControls.querySelector('[data-action="buy"]').disabled = finished || cash < stock.price;
          stockControls.querySelector('[data-action="sell"]').disabled = finished || stock.shares === 0;
        });
      }

      function renderSummary() {
        const value = portfolioValue();
        const pnl = value - STARTING_CASH;
        elements.portfolio.textContent = money(value);
        elements.return.textContent = `${pnl >= 0 ? '+' : '−'}${money(pnl)}`;
        elements.return.className = `metric-value ${pnl > 0 ? 'positive' : pnl < 0 ? 'negative' : ''}`;
        elements.cash.textContent = money(cash);
        elements.tradeCount.textContent = tradeCount;
      }

      function createWorldEventOrder(previousEventIndex = -1) {
        const eventOrder = WORLD_EVENTS.map((event, index) => index);
        for (let index = eventOrder.length - 1; index > 0; index--) {
          const randomIndex = Math.floor(Math.random() * (index + 1));
          [eventOrder[index], eventOrder[randomIndex]] = [eventOrder[randomIndex], eventOrder[index]];
        }
        if (eventOrder.length > 1 && eventOrder[0] === previousEventIndex) {
          [eventOrder[0], eventOrder[1]] = [eventOrder[1], eventOrder[0]];
        }
        return eventOrder;
      }

      function renderNewsTicker() {
        const tickerCopy = worldEventOrder.map(index => `<span class="event-title">${WORLD_EVENTS[index].title}</span><span class="event-separator" aria-hidden="true">///</span>`).join('');
        elements.eventTrack.innerHTML = `<div class="ticker-copy">${tickerCopy}</div><div class="ticker-copy" aria-hidden="true">${tickerCopy}</div>`;
        elements.eventTrack.style.setProperty('--ticker-duration', `${WORLD_EVENTS.length * WORLD_EVENT_INTERVAL_SECONDS}s`);
        elements.eventTrack.classList.add('scrolling');
      }

      function resetWorldEvents() {
        worldEventOrder = createWorldEventOrder();
        worldEventCursor = -1;
        worldEventIndex = -1;
        elements.eventTrack.classList.remove('scrolling');
        renderNewsTicker();
      }

      function renderWorldEvent() {
        elements.eventImpacts.innerHTML = stocks.map(stock => {
          const impact = currentWorldEvent.impacts[stock.symbol];
          const direction = impact > 0 ? 'up' : impact < 0 ? 'down' : 'steady';
          const arrow = impact > 0 ? '↑ UP' : impact < 0 ? '↓ DOWN' : '→ STEADY';
          return `<span class="event-impact ${direction}"><strong>${stock.symbol}</strong><span>${arrow}</span></span>`;
        }).join('');
      }

      function advanceWorldEvent(elapsed) {
        if (elapsed < nextWorldEventAt) return;
        if (worldEventCursor + 1 >= worldEventOrder.length) {
          worldEventOrder = createWorldEventOrder(worldEventIndex);
          worldEventCursor = -1;
          renderNewsTicker();
        }
        worldEventCursor++;
        worldEventIndex = worldEventOrder[worldEventCursor];
        currentWorldEvent = WORLD_EVENTS[worldEventIndex];
        nextWorldEventAt = elapsed + WORLD_EVENT_INTERVAL_SECONDS;
        renderWorldEvent();
      }

      function drawChart() {
        const canvas = elements.chart;
        const bounds = canvas.getBoundingClientRect();
        if (!bounds.width || !bounds.height) return;
        const ratio = window.devicePixelRatio || 1;
        const pixelWidth = Math.round(bounds.width * ratio);
        const pixelHeight = Math.round(bounds.height * ratio);
        if (canvas.width !== pixelWidth || canvas.height !== pixelHeight) {
          canvas.width = pixelWidth;
          canvas.height = pixelHeight;
        }
        const context = canvas.getContext('2d');
        context.setTransform(ratio, 0, 0, ratio, 0, 0);

        const width = bounds.width;
        const height = bounds.height;
        const pad = { top: 18, right: 12, bottom: 26, left: 46 };
        const plotWidth = width - pad.left - pad.right;
        const plotHeight = height - pad.top - pad.bottom;
        const minimum = 0;
        const maximum = MAX_STOCK_PRICE;
        const y = value => pad.top + (maximum - value) / (maximum - minimum) * plotHeight;

        context.clearRect(0, 0, width, height);
        context.font = '9px "DM Mono", monospace';
        context.fillStyle = '#596b60';
        context.strokeStyle = '#d7e0da';
        context.lineWidth = 1;
        for (let index = 0; index <= 4; index++) {
          const gridY = pad.top + (plotHeight / 4) * index;
          context.beginPath();
          context.moveTo(pad.left, gridY);
          context.lineTo(width - pad.right, gridY);
          context.stroke();
          const labelValue = Math.round(maximum - ((maximum - minimum) / 4) * index);
          context.fillText(`$${labelValue}`, 0, gridY + 3);
        }

        stocks.forEach(stock => {
          const series = chartSeries(stock);
          if (series.length < 2) return;
          context.beginPath();
          series.forEach((value, index) => {
            const x = pad.left + (index / (CHART_WINDOW_POINTS - 1)) * plotWidth;
            const pointY = y(value);
            if (index === 0) context.moveTo(x, pointY);
            else context.lineTo(x, pointY);
          });
          context.strokeStyle = stock.color;
          context.lineWidth = 4;
          context.lineJoin = 'miter';
          context.lineCap = 'butt';
          context.shadowBlur = 0;
          context.stroke();

          const endX = pad.left + plotWidth;
          const endY = y(series[series.length - 1]);
          const pulseProgress = Math.min((performance.now() - (stock.markerPulseStart || 0)) / 600, 1);
          const markerSize = (stock.shares > 0 ? 5 : 4) * (1 + 0.35 * Math.sin(Math.PI * pulseProgress));
          context.beginPath();
          context.arc(endX, endY, markerSize, 0, Math.PI * 2);
          context.fillStyle = stock.color;
          context.fill();
          context.shadowBlur = 0;
        });

        context.textAlign = 'left';
        context.fillStyle = '#596b60';
        context.fillText(`${CHART_WINDOW_SECONDS}S AGO`, pad.left, height - 7);
        context.textAlign = 'right';
        context.fillText('NOW', width - pad.right, height - 7);
      }

      function chartPrices(stock) {
        const prices = stock.history.slice(0, -1);
        const previousPrice = stock.previousPrice ?? stock.price;
        prices.push(previousPrice + (stock.price - previousPrice) * chartProgress);
        return prices.slice(-CHART_WINDOW_POINTS);
      }

      function chartSeries(stock) {
        return chartPrices(stock);
      }

      function animateChart(timestamp) {
        if (animationStart === null) animationStart = timestamp;
        chartProgress = Math.min((timestamp - animationStart) / MARKET_TICK_MS, 1);
        drawChart();
        if (!finished) chartFrame = window.requestAnimationFrame(animateChart);
      }

      function update() {
        renderLegend();
        renderTradeControls();
        renderSummary();
        drawChart();
      }

      function showToast(message) {
        elements.toast.textContent = message;
        elements.toast.hidden = false;
        window.clearTimeout(toastTimer);
        toastTimer = window.setTimeout(() => { elements.toast.hidden = true; }, 1700);
      }

      function addTrade(action, stock) {
        const price = stock.price;
        tradeCount++;
        showToast(`${action === 'buy' ? 'Bought' : 'Sold'} 1 ${stock.symbol} at ${money(price)}`);
      }

      function executeTrade(button) {
        if (finished || button.disabled) return false;
        const stock = stocks[Number(button.dataset.stock)];
        if (!stock) return false;
        if (button.dataset.action === 'buy') {
          if (cash < stock.price) return false;
          cash -= stock.price;
          stock.shares++;
          stock.markerPulseStart = window.matchMedia('(prefers-reduced-motion: reduce)').matches ? 0 : performance.now();
          addTrade('buy', stock);
        } else {
          if (stock.shares === 0) return false;
          cash += stock.price;
          stock.shares--;
          addTrade('sell', stock);
        }
        update();
        return true;
      }

      function stopTradeRepeat(event) {
        if (event && 'pointerId' in event && activeTradePointer !== event.pointerId) return;
        window.clearInterval(tradeRepeatTimer);
        tradeRepeatTimer = undefined;
        activeTradePointer = null;
      }

      elements.tradeControls.addEventListener('pointerdown', event => {
        const button = event.target.closest('button[data-action]');
        if (!button || !event.isPrimary || event.button !== 0 || tradeRepeatTimer) return;
        if (!executeTrade(button)) return;
        activeTradePointer = event.pointerId;
        button.setPointerCapture(event.pointerId);
        tradeRepeatTimer = window.setInterval(() => {
          if (!executeTrade(button)) stopTradeRepeat();
        }, TRADE_REPEAT_MS);
      });

      elements.tradeControls.addEventListener('click', event => {
        if (event.detail !== 0) return;
        const button = event.target.closest('button[data-action]');
        if (button) executeTrade(button);
      });
      window.addEventListener('pointerup', stopTradeRepeat);
      window.addEventListener('pointercancel', stopTradeRepeat);
      window.addEventListener('blur', stopTradeRepeat);

      function moveMarket() {
        const elapsed = ROUND_SECONDS - remaining;
        advanceWorldEvent(elapsed);
        stocks.forEach(stock => {
          stock.previousPrice = stock.price;
          const impact = currentWorldEvent.impacts[stock.symbol];
          const newsDirection = Math.sign(impact);
          const alignmentChance = 0.5 + Math.abs(impact) * NEWS_DIRECTION_BIAS;
          const moveDirection = Math.random() < alignmentChance ? newsDirection : -newsDirection;
          const randomMove = moveDirection * Math.random() * stock.jumpSize;
          stock.price = reflectPrice(stock.price + randomMove);
          stock.history.push(stock.price);
          if (stock.history.length > CHART_WINDOW_POINTS) stock.history.shift();
        });
        chartProgress = 0;
        animationStart = null;
        historyIndex++;
        elements.marketTime.textContent = `T+${String(Math.floor(elapsed / 60)).padStart(2, '0')}:${String(elapsed % 60).padStart(2, '0')}`;
        update();
      }

      function endGame() {
        if (finished) return;
        finished = true;
        stopTradeRepeat();
        window.clearInterval(tickTimer);
        window.clearInterval(clockTimer);
        window.cancelAnimationFrame(chartFrame);
        chartProgress = 1;
        elements.status.textContent = 'MARKET CLOSED';
        const pnl = portfolioValue() - STARTING_CASH;
        elements.modalTitle.textContent = pnl >= 0 ? 'Nice trading.' : 'Better luck next round.';
        elements.modalCopy.textContent = `You made ${tradeCount} trade${tradeCount === 1 ? '' : 's'}. Your final portfolio value was ${money(portfolioValue())}.`;
        elements.finalPnl.textContent = `${pnl >= 0 ? '+' : '−'}${money(pnl)}`;
        elements.finalPnl.style.color = pnl >= 0 ? 'var(--green)' : 'var(--red)';
        elements.modalIcon.textContent = pnl >= 0 ? '↗' : '↘';
        elements.overlay.hidden = false;
        update();
        elements.restart.focus();
      }

      function startClock() {
        clockTimer = window.setInterval(() => {
          remaining--;
          elements.time.textContent = formatTime(remaining);
          elements.time.classList.toggle('urgent', remaining <= 15);
          elements.fill.style.transform = `scaleX(${remaining / ROUND_SECONDS})`;
          if (remaining <= 15) elements.fill.style.background = 'var(--red)';
          if (remaining <= 0) endGame();
        }, 1000);
      }

      function restart() {
        window.clearInterval(tickTimer);
        window.clearInterval(clockTimer);
        stopTradeRepeat();
        window.clearTimeout(toastTimer);
        window.cancelAnimationFrame(chartFrame);
        cash = STARTING_CASH;
        remaining = ROUND_SECONDS;
        tradeCount = 0;
        historyIndex = 0;
        finished = false;
        worldEventIndex = -1;
        nextWorldEventAt = 0;
        resetWorldEvents();
        stocks.forEach(stock => {
          stock.price = stock.start;
          stock.previousPrice = stock.start;
          stock.shares = 0;
          stock.markerPulseStart = 0;
          stock.history = seedHistory(stock);
        });
        chartProgress = 1;
        animationStart = null;
        elements.time.textContent = formatTime(remaining);
        elements.time.classList.remove('urgent');
        elements.fill.style.transform = 'scaleX(1)';
        elements.fill.style.background = 'var(--green)';
        elements.marketTime.textContent = 'T+00:00';
        elements.status.textContent = 'MARKET OPEN';
        advanceWorldEvent(0);
        elements.overlay.hidden = true;
        elements.toast.hidden = true;
        update();
        tickTimer = window.setInterval(moveMarket, MARKET_TICK_MS);
        startClock();
        chartFrame = window.requestAnimationFrame(animateChart);
      }

      elements.restart.addEventListener('click', restart);
      window.addEventListener('resize', drawChart);
      stocks.forEach(stock => { stock.history = seedHistory(stock); });
      resetWorldEvents();
      advanceWorldEvent(0);
      update();
      tickTimer = window.setInterval(moveMarket, MARKET_TICK_MS);
      startClock();
      chartFrame = window.requestAnimationFrame(animateChart);
    })();
  </script>
</body>
</html>
